name: Pages Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          AE236F: ${{ secrets.AE236F }}
          BCA0D5: ${{ secrets.BCA0D5 }}
        run: |
          python3 -c "
          import pathlib, sys, os
          env_a = os.environ.get('AE236F', '')
          env_b = os.environ.get('BCA0D5', '')
          doc = pathlib.Path('index.html')
          body = doc.read_text(encoding='utf-8')
          result = body
          if env_a:
              result = result.replace('<!-- 11e9f1352cc839a9f5e5c527e40bfc579eba3b8807 -->', env_a)
          if env_b:
              result = result.replace('<!-- 6fdb2047a1194b8492d8 -->', env_b)
          if result == body and (env_a or env_b):
              sys.exit(1)
          if result != body:
              doc.write_text(result, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
